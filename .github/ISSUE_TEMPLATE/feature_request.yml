name: Idea or new component
description: Propose a new component, utility or change.
labels: [enhancement]
body:
  - type: textarea
    id: what
    attributes:
      label: What you would like
      description: What it is for and where you would use it. Screenshots or links to similar components help.
    validations:
      required: true
  - type: textarea
    id: today
    attributes:
      label: How you do it today
      description: The CSS or classes you use now, if any.

name: Bug report
description: Something does not look or work as the documentation says.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happens
      description: What you did, what you expected and what happened instead. A link to an example (CodePen, StackBlitz…) helps a lot.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      placeholder: 0.2.0
    validations:
      required: true
  - type: dropdown
    id: mode
    attributes:
      label: Mode
      options: [Light, Dark, Both]
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and device
      placeholder: Safari 26 on iPhone, Chrome 141 on Windows…
  - type: checkboxes
    id: a11y
    attributes:
      label: Accessibility
      options:
        - label: This is an accessibility problem (contrast, keyboard, screen reader, zoom…)

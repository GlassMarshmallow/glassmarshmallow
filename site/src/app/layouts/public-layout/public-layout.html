<!-- Fondo de luces de portfolio-ia-template (sin ilustración, puntos ni efecto de televisor): solo en la portada.
     El resto de páginas usan el fondo liso -->
@if (isHome()) {
<div class="gm-backdrop" aria-hidden="true">
  <span class="gm-backdrop__vignette"></span>
</div>
}
<a class="gm-skip-link" href="#contenido">{{ 'common.skipLink' | t }}</a>
<app-header />
<main id="contenido" tabindex="-1" [class.main--home]="isHome()">
  <router-outlet />
</main>
<!-- Portada: degradado hasta el pie que ocupa el espacio libre. En el resto, solo un hueco flexible -->
<div [class.page-end-fade]="isHome()" class="page-end" aria-hidden="true"></div>
<app-footer />

<!-- Menú lateral del framework (gm-sidenav): aquí solo se abre y se cierra en el móvil -->
<div class="gm-sidenav-layout gm-container">
  <button
    type="button"
    class="gm-btn gm-btn--secondary gm-btn--sm gm-sidenav__toggle"
    aria-controls="docs-sidebar"
    [attr.aria-expanded]="menuOpen()"
    (click)="menuOpen.set(!menuOpen())"
  >
    <i class="gmi gmi-list" aria-hidden="true"></i>{{ 'docsNav.browse' | t }}
  </button>

  <nav id="docs-sidebar" class="gm-sidenav" [class.is-open]="menuOpen()" [attr.aria-label]="'docsNav.menu' | t">
    @for (section of sections; track section.id) {
      <div class="gm-sidenav__group">
        <h2 class="gm-sidenav__title">
          <i class="gmi {{ section.icon }}" aria-hidden="true"></i>{{ 'docsNav.sections.' + section.id | t }}
        </h2>
        <ul class="gm-sidenav__list">
          @for (page of section.pages; track page.path) {
            <li>
              <a class="gm-sidenav__link" [routerLink]="'/docs/' + page.path" routerLinkActive ariaCurrentWhenActive="page">{{ pageTitleKey(page.path) | t }}</a>
            </li>
          }
        </ul>
      </div>
    }
  </nav>

  <div class="gm-sidenav-layout__main">
    <router-outlet />
  </div>
</div>

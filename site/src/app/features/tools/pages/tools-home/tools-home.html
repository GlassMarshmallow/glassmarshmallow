<section class="gm-container gm-page" aria-labelledby="tools-title">
  <h1 id="tools-title">{{ 'tools.title' | t }}</h1>
  <p class="gm-lead gm-muted">{{ 'tools.lead' | t }}</p>

  @for (group of groups; track group.id; let first = $first) {
    <h2 class="gm-mx-0 gm-mb-[1.125rem] gm-text-[1.4rem]" [class.gm-mt-2]="first" [class.gm-mt-12]="!first" [id]="'tools-' + group.id">{{ group.title | t }}</h2>
    <!-- Tarjetas de 16,25 rem como mínimo; cada herramienta es un .panel de My Book Box (gm-card) que sube un poco al
         pasar el ratón, como sus botones -->
    <ul class="gm-grid gm-grid--auto gm-grid-min-[16.25rem] gm-gap-5 gm-m-0 gm-list-none" [attr.aria-labelledby]="'tools-' + group.id">
      @for (tool of group.tools; track tool.id) {
        <li class="gm-d-grid">
          <a class="gm-card gm-card--link gm-d-grid gm-content-start gm-gap-2 gm-p-6" [routerLink]="['/tools', tool.id]">
            <i class="gmi {{ tool.icon }} gm-text-[1.6rem]" aria-hidden="true"></i>
            <strong class="gm-text-[1.1rem]">{{ tool.i18n + '.title' | t }}</strong>
            <span class="gm-muted gm-text-[.9rem] gm-leading-normal">{{ tool.i18n + '.lead' | t: { max: 5 } }}</span>
          </a>
        </li>
      }
    </ul>
  }
</section>

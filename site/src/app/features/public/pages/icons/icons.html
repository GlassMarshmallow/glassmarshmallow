<section class="gm-container gm-page" aria-labelledby="icons-title">
  <h1 id="icons-title">{{ 'icons.title' | t }}</h1>
  <p class="gm-lead gm-mb-8 gm-muted">{{ 'icons.lead' | t: { line: lineCount, fill: fillCount, brands: brandCount } }}</p>

  <div class="icons-page__filters">
    <div class="gm-field icons-page__search">
      <label for="icon-search">{{ 'icons.search' | t }}</label>
      <input id="icon-search" type="search" [placeholder]="'icons.searchPlaceholder' | t" (input)="onSearch($event)" />
    </div>
    <div class="gm-field">
      <label for="icon-category">{{ 'icons.category' | t }}</label>
      <select id="icon-category" (change)="onCategory($event)">
        <option value="">{{ 'icons.allCategories' | t }}</option>
        @for (category of categories; track category) {
          <option [value]="category">{{ category }}</option>
        }
      </select>
    </div>
  </div>
  <p class="icons-page__count gm-muted" aria-live="polite">{{ 'icons.found' | t: { count: icons().length } }}</p>

  @if (icons().length) {
    <ul class="grid">
      @for (icon of icons(); track icon.name) {
        <li>
          <a class="tile" [routerLink]="['/icons', icon.name]">
            <span class="tile__box"><i class="gmi gmi-{{ icon.name }}" aria-hidden="true"></i></span>
            <span class="tile__name">{{ icon.name }}</span>
          </a>
        </li>
      }
    </ul>
  } @else {
    <p class="gm-muted">{{ 'icons.empty' | t }}</p>
  }
</section>

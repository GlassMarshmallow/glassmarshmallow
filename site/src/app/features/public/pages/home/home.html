<section class="hero gm-container" aria-labelledby="hero-title">
  <img class="hero__logo" src="logo.svg" alt="" width="120" height="120" />
  <h1 id="hero-title" class="gm-gradient-title gm-text-outline">GlassMarshmallow</h1>
  <p class="hero__lead gm-text-outline">{{ 'home.lead' | t }}</p>
  <div class="hero__actions">
    <app-copy-command [command]="installCommand" />
    <a class="gm-btn" routerLink="/docs">
      <i class="gmi gmi-book" aria-hidden="true"></i>{{ 'home.readDocs' | t }}
    </a>
  </div>
  <p class="gm-muted gm-small">{{ 'home.currently' | t: { version } }}</p>
</section>

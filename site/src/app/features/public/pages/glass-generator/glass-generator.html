<section class="gm-container gm-page" aria-labelledby="generator-title">
  <app-back-link path="/tools" section="nav.tools" />
  <h1 id="generator-title">{{ 'glass.title' | t }}</h1>
  <p class="gm-lead gm-muted">{{ 'glass.lead' | t }}</p>

  <div class="gm-tool">
    <!-- Muestra: fondo con las luces del portfolio y formas para que se note el desenfoque -->
    <div class="preview" aria-hidden="true">
      <span class="preview__shape preview__shape--cyan"></span>
      <span class="preview__shape preview__shape--violet"></span>
      <span class="preview__shape preview__shape--amber"></span>
      <div class="preview__card" [style]="cardStyle()">
        <strong>{{ sampleTitle() || ('glass.sampleTitle' | t) }}</strong>
        <span>{{ sampleText() || 'GlassMarshmallow' }}</span>
      </div>
    </div>

    <div class="gm-card gm-tool__controls">
      <div class="gm-slider">
        <label for="glass-transparency">{{ 'glass.transparency' | t }}</label>
        <output for="glass-transparency">{{ transparency() }} %</output>
        <input id="glass-transparency" class="gm-range" type="range" min="0" max="100" [value]="transparency()" (input)="setNumber(transparency, $event)" />
      </div>
      <div class="gm-slider">
        <label for="glass-blur">{{ 'glass.blur' | t }}</label>
        <output for="glass-blur">{{ blur() }} px</output>
        <input id="glass-blur" class="gm-range" type="range" min="0" max="40" [value]="blur()" (input)="setNumber(blur, $event)" />
      </div>
      <div class="gm-slider">
        <label for="glass-outline">{{ 'glass.outline' | t }}</label>
        <output for="glass-outline">{{ outline() }} %</output>
        <input id="glass-outline" class="gm-range" type="range" min="0" max="100" [value]="outline()" (input)="setNumber(outline, $event)" />
      </div>
      <div class="gm-slider">
        <label for="glass-radius">{{ 'glass.corners' | t }}</label>
        <output for="glass-radius">{{ radius() }} px</output>
        <input id="glass-radius" class="gm-range" type="range" min="0" max="48" [value]="radius()" (input)="setNumber(radius, $event)" />
      </div>
      <app-color-picker [label]="'glass.color' | t" [alpha]="false" [(value)]="color" />

      <app-sample-texts [fields]="sampleFields()" />

      <div class="gm-tool__code">
        <pre class="gm-code" tabindex="0" [attr.aria-label]="'common.generatedCss' | t"><code [innerHTML]="css() | highlight: 'css'"></code></pre>
        <div class="code__actions">
          <button type="button" class="gm-btn gm-btn--sm" (click)="copy()">
            <i class="gmi" [class.gmi-clipboard]="!copied()" [class.gmi-check]="copied()" aria-hidden="true"></i>
            {{ (copied() ? 'common.copied' : 'common.copyCss') | t }}
          </button>
          <button type="button" class="gm-btn gm-btn--ghost gm-btn--sm" (click)="reset()">{{ 'glass.reset' | t }}</button>
        </div>
        <span class="gm-visually-hidden" aria-live="polite">{{ copied() ? ('common.cssCopied' | t) : '' }}</span>
      </div>
    </div>
  </div>
</section>

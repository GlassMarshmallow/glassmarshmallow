<div class="copy-command">
  <code class="copy-command__text" [innerHTML]="command() | highlight: 'sh'"></code>
  <button type="button" class="gm-btn gm-btn--secondary gm-btn--sm" (click)="copy()">
    <i class="gmi" [class.gmi-clipboard]="!copied()" [class.gmi-check]="copied()" aria-hidden="true"></i>
    {{ (copied() ? 'common.copied' : 'common.copy') | t }}
  </button>
  <span class="gm-visually-hidden" aria-live="polite">{{ copied() ? ('common.commandCopied' | t) : '' }}</span>
</div>

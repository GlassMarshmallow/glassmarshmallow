<button
  #trigger
  type="button"
  class="menu__trigger"
  aria-haspopup="menu"
  [attr.aria-expanded]="open()"
  [attr.aria-label]="label()"
  [title]="label()"
  (click)="toggle()"
  (keydown.escape)="close(true)"
>
  <ng-content />
  <i class="mgi mgi-chevron-expand menu__chevron" aria-hidden="true"></i>
</button>

@if (open()) {
  <ul class="menu__list" role="menu" [attr.aria-label]="label()" (keydown)="onMenuKeydown($event)">
    @for (option of options(); track option.value) {
      <li role="none">
        <button
          type="button"
          class="menu__item"
          role="menuitemradio"
          [attr.aria-checked]="option.value === selected()"
          (click)="choose(option)"
        >
          @if (option.icon) {
            <i class="mgi {{ option.icon }}" aria-hidden="true"></i>
          }
          <span>{{ option.label }}</span>
          <i class="mgi mgi-check menu__check" aria-hidden="true"></i>
        </button>
      </li>
    }
  </ul>
}

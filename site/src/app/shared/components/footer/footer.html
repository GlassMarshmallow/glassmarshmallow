<footer class="footer gm-has-tabbar">
  <div class="gm-container footer__inner">
    <nav class="footer__links" [attr.aria-label]="'footer.nav' | t">
      <a routerLink="/docs">{{ 'nav.docs' | t }}</a>
      <a routerLink="/examples">{{ 'nav.examples' | t }}</a>
      <a routerLink="/icons">{{ 'nav.icons' | t }}</a>
      <a routerLink="/blog">{{ 'nav.blog' | t }}</a>
      <a href="https://github.com/spyamuza">GitHub</a>
    </nav>
    <!-- Al desplegar: el nombre enlaza al portfolio (pendiente de dominio) -->
    <p class="footer__credit gm-muted gm-small">
      {{ 'footer.credit' | t }} <span class="footer__author gm-gradient-text">Sara Paez Yamuza</span>
      · {{ 'footer.license' | t }} · {{ 'footer.version' | t: { version } }}
    </p>
  </div>
</footer>

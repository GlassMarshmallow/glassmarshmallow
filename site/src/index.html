<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>GlassMarshmallow</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="A CSS framework with glass surfaces, light and dark mode and WCAG 2.2 AA accessibility.">
  <meta name="theme-color" content="#f5f5f7">
  <!-- Montserrat, la letra opcional del framework (../css/glassmarshmallow-font.css), se pide desde el principio para
       que el texto no cambie de letra al cargar. Angular la deja en media/ con su nombre (outputHashing "bundles") -->
  <link rel="preload" href="media/montserrat-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="icon" type="image/svg+xml" href="logo.svg">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <!-- Aplica el tema antes de pintar para evitar un destello; ThemeService toma el relevo al arrancar. -->
  <script>
    (function () {
      var pref; try { pref = localStorage.getItem('glassmarshmallow.theme'); } catch (e) {}
      var dark = pref === 'dark' || (pref !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches);
      document.documentElement.dataset.theme = dark ? 'dark' : 'light';
      // Idioma: el de la dirección (inglés en «/», español en «/es/»)
      document.documentElement.lang = location.pathname.indexOf('/es/') === 0 || location.pathname === '/es' ? 'es' : 'en';
      var themeColor = document.querySelector('meta[name="theme-color"]');
      if (themeColor) themeColor.setAttribute('content', dark ? '#000000' : '#f5f5f7');
    })();
  </script>
  <!-- Estadísticas (Umami, sin cookies): visitas y descargas de iconos; solo cuenta en glassmarshmallow.com, no en local -->
  <script defer src="/stats/script.js" data-website-id="35cf57f0-522e-4556-8ea7-628fb9b33707" data-domains="glassmarshmallow.com"></script>
</head>
<body>
  <app-root></app-root>
</body>
</html>

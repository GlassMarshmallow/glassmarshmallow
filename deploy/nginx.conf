# www.<dominio> → <dominio>: para Google son dos sitios distintos con el mismo contenido; así solo queda uno
server {
  listen 80;
  server_name ~^www\.(?<dominio>.+)$;
  server_tokens off;
  return 301 https://$dominio$request_uri;
}

server {
  listen 80 default_server;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # No mostrar la versión de nginx; redirecciones relativas (detrás del túnel el puerto real no es el 80)
  server_tokens off;
  absolute_redirect off;

  # Cabeceras de seguridad básicas
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml text/plain application/xml;
  gzip_min_length 1024;

  # Archivos con hash en el nombre (JS/CSS de Angular): se pueden guardar en caché mucho tiempo
  location ~* \.(?:js|css)$ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    add_header X-Content-Type-Options "nosniff" always;
    try_files $uri =404;
  }

  # Iconos, imágenes y fuentes
  location ~* \.(?:svg|png|jpg|jpeg|webp|ico|woff2?)$ {
    expires 7d;
    add_header Cache-Control "public";
    add_header X-Content-Type-Options "nosniff" always;
    try_files $uri =404;
  }

  # Español: cada página está generada en /es/<ruta>/index.html; lo que no exista lo abre la web en español
  location /es/ {
    add_header Cache-Control "no-cache";
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    try_files $uri $uri/index.html /es/index.html;
  }

  # Inglés: igual, con la web en inglés de reserva. Las páginas siempre frescas, para que los cambios se vean al momento
  location / {
    add_header Cache-Control "no-cache";
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    try_files $uri $uri/index.html /index.html;
  }
}

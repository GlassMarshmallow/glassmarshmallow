# www.<dominio> → <dominio>: para Google son dos sitios distintos con el mismo contenido; así solo queda uno
server {
  listen 80;
  server_name ~^www\.(?<dominio>.+)$;
  server_tokens off;
  return 301 https://$dominio$request_uri;
}

server {
  listen 80 default_server;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # No mostrar la versión de nginx; redirecciones relativas (detrás del túnel el puerto real no es el 80)
  server_tokens off;
  absolute_redirect off;

  # Cabeceras de seguridad básicas
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml text/plain application/xml;
  gzip_min_length 1024;

  # Archivos con hash en el nombre (JS/CSS de Angular): se pueden guardar en caché mucho tiempo
  location ~* \.(?:js|css)$ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    add_header X-Content-Type-Options "nosniff" always;
    try_files $uri =404;
  }

  # Iconos, imágenes y fuentes
  location ~* \.(?:svg|png|jpg|jpeg|webp|ico|woff2?)$ {
    expires 7d;
    add_header Cache-Control "public";
    add_header X-Content-Type-Options "nosniff" always;
    try_files $uri =404;
  }

  # Estadísticas (Umami, en ~/apps/estadisticas): el script y las visitas pasan por aquí hasta el contenedor
  # "umami" de la red estadisticas-compartido. ^~ para que no lo atrape la regla de los .js de arriba.
  location ^~ /stats/ {
    resolver 127.0.0.11 valid=30s;
    set $stats_upstream http://umami:3000;
    rewrite ^/stats/(.*)$ /$1 break;
    proxy_pass $stats_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    client_max_body_size 16k;
  }

  # Español: cada página está generada en /es/<ruta>/index.html; lo que no exista lo abre la web en español
  location /es/ {
    # El navegador pregunta siempre (max-age=0), pero a Cloudflare, que guarda la página 5 minutos (CDN-Cache-Control,
    # con la regla de caché «Páginas y documentación» del panel): rápida y, tras publicar, al día en 5 minutos como mucho
    add_header Cache-Control "public, max-age=0, must-revalidate";
    add_header CDN-Cache-Control "max-age=300";
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    try_files $uri $uri/index.html /es/index.html;
  }

  # Inglés: igual, con la web en inglés de reserva. También los textos de la documentación (content/docs/…/*.md)
  location / {
    # El navegador pregunta siempre (max-age=0), pero a Cloudflare, que guarda la página 5 minutos (CDN-Cache-Control,
    # con la regla de caché «Páginas y documentación» del panel): rápida y, tras publicar, al día en 5 minutos como mucho
    add_header Cache-Control "public, max-age=0, must-revalidate";
    add_header CDN-Cache-Control "max-age=300";
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    try_files $uri $uri/index.html /index.html;
  }
}
